schema_version: 1

context:
  name: planetarypy
  version: "0.84.2"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 27c2df5db946b1126ebae29db69517ed1540398b8482dde2e97bea319c2edb6b

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - plp = planetarypy.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - astropy-base
    - typer >=0.9
    - numpy
    - pandas
    - pyarrow
    - pooch
    - pvl
    - lxml
    - python-dateutil
    - requests
    - tomlkit
    - tqdm
    - yarl
    - loguru
    - python-duckdb
    - rasterio
    - pyproj
    - rioxarray
    - matplotlib-base
    - rich
    - shapely
    - antimeridian
    - pdr
    - pillow
    # SPICE is a flagship feature and conda has no "extras" mechanism, so the
    # pip [spice] extra (spiceypy + scipy) ships in the conda package directly.
    - spiceypy
    - scipy

tests:
  - python:
      imports:
        - planetarypy
        - planetarypy.constants
        - planetarypy.pds
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      - plp --help

about:
  homepage: https://github.com/planetarypy/planetarypy
  summary: Python tools for planetary science data access — PDS indexes, SPICE kernels, instrument data, and per-body constants
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/planetarypy/planetarypy
  documentation: https://michaelaye.github.io/planetarypy

extra:
  recipe-maintainers:
    - michaelaye
    - cjtu
